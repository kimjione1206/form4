[project]
name = "form4"
version = "0.1.0"
description = "미국 임원 거래 정리 (SEC Form 4 한국어 정리)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "jinja2>=3.1",
    "pillow>=12.3.0",
]

[project.scripts]
form4 = "form4.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
