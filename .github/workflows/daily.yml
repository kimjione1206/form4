name: daily
on:
  schedule:
    - cron: "7 21 * * *"   # 06:07 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run pytest -q 2>&1 | tee run.log
      - name: collect and render
        run: uv run form4 daily 2>&1 | tee -a run.log
      - name: deploy
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: commit data
        run: |
          git config user.name "form4-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) 갱신"
          git pull --rebase
          git push
      - name: wake Claude routine
        if: failure()
        run: python3 ops/wake_routine.py run.log
        env:
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_TOKEN: ${{ secrets.ROUTINE_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
